name: Publish to npm

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 24 ships npm 11.5.1+, required for OIDC trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      - name: Publish if this version is new
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "vite-plugin-upload-to-hubspot@${VERSION}" version >/dev/null 2>&1; then
            echo "vite-plugin-upload-to-hubspot@${VERSION} is already on npm; skipping."
            exit 0
          fi
          # No NODE_AUTH_TOKEN — npm uses GitHub OIDC (trusted publishing).
          npm publish --access public
